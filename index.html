<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <h1>Make It Matter – Charity Craft Project Finder</h1>
        <p>A searchable directory of craft projects supporting charities across Australia. Filter by the material, skills, or time you have, or find a cause that matters to you. Every bit helps.</p>
    </header>

    <main>
        <div id="searchView">
            <!-- Top Search Bar -->
            <div class="search-section">
                <label for="search">Search Projects</label>
                <input type="text" id="search" placeholder="e.g. blankets, toys...">
            </div>

            <div class="content-wrapper">
                <!-- Sidebar Filters -->
                <aside class="sidebar">
                    <h3>Filters</h3>
                    
                    <div class="filter-group">
                        <label for="craftFilter">Craft Type</label>
                        <div id="craftFilter" class="checkbox-list">
                            <!-- Checkboxes populated by JS -->
                        </div>
                    </div>

                    <div class="filter-group">
                        <label for="materialFilter">Material</label>
                        <div id="materialFilter" class="checkbox-list">
                            <!-- Checkboxes populated by JS -->
                        </div>
                    </div>

                    <div class="filter-group">
                        <label for="timeFilter">Time Estimate</label>
                        <div id="timeFilter" class="checkbox-list">
                            <!-- Checkboxes populated by JS -->
                        </div>
                    </div>

                    <div class="filter-group">
                        <label for="recipientFilter">Category</label>
                        <div id="recipientFilter" class="checkbox-list">
                            <!-- Checkboxes populated by JS -->
                        </div>
                    </div>
                </aside>

                <!-- Results Grid -->
                <section id="projectGrid" class="grid-container">
                    <!-- Cards injected here -->
                </section>
            </div>
            <p id="noResults" class="hidden">No projects found matching your criteria.</p>
        </div>
        
        <!-- Project Details View -->
        <section id="projectDetails" class="hidden detail-view-container">
            <button id="backToList" class="back-button">← Back to search</button>
            <div id="detailsContent"></div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
